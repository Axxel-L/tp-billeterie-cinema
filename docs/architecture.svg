<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-label="Architecture de la billetterie">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0710"/>
      <stop offset="1" stop-color="#060810"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d71"/>
      <stop offset="1" stop-color="#ff8aa5"/>
    </linearGradient>
    <pattern id="grille" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1100" height="570" fill="url(#fond)"/>
  <rect width="1100" height="570" fill="url(#grille)"/>

  <text x="48" y="58" font-family="Manrope, Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#fff">Architecture</text>
  <text x="48" y="84" font-family="Manrope, Inter, system-ui, sans-serif" font-size="13" fill="#9aa3b8">SPA React servie par l'API Spring Boot · MySQL transactionnel · TMDB pour les médias</text>

  <!-- Navigateur -->
  <g transform="translate(48 128)">
    <rect width="250" height="250" rx="24" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".18"/>
    <rect x="22" y="22" width="46" height="46" rx="14" fill="#7dd3fc" fill-opacity=".14" stroke="#7dd3fc" stroke-opacity=".4"/>
    <path d="M34 38h22v16H34zM34 38l22 16M56 38L34 54" stroke="#7dd3fc" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="82" y="44" font-family="Manrope, Inter, sans-serif" font-size="16" font-weight="700" fill="#fff">Navigateur</text>
    <text x="82" y="64" font-family="Manrope, Inter, sans-serif" font-size="11" fill="#9aa3b8">React 19 · Vite · Tailwind</text>
    <text x="22" y="110" font-family="Manrope, Inter, sans-serif" font-size="12" fill="#c9cfdd">• Hero streaming + trailer</text>
    <text x="22" y="136" font-family="Manrope, Inter, sans-serif" font-size="12" fill="#c9cfdd">• Liquid glass navbar / boutons</text>
    <text x="22" y="162" font-family="Manrope, Inter, sans-serif" font-size="12" fill="#c9cfdd">• GridScan CSS + PageGate</text>
    <text x="22" y="188" font-family="Manrope, Inter, sans-serif" font-size="12" fill="#c9cfdd">• TanStack Query · Bun</text>
    <text x="22" y="220" font-family="Manrope, Inter, sans-serif" font-size="11" fill="#ff8aa5">Aucun secret dans le bundle</text>
  </g>

  <!-- API -->
  <g transform="translate(380 100)">
    <rect width="320" height="306" rx="24" fill="#ffffff" fill-opacity=".04" stroke="#ff8aa5" stroke-opacity=".35"/>
    <rect x="22" y="22" width="46" height="46" rx="14" fill="#ff3d71" fill-opacity=".18" stroke="#ff8aa5" stroke-opacity=".5"/>
    <path d="M32 42h26M32 50h26M32 58h26" stroke="#ff8aa5" stroke-width="2.4" stroke-linecap="round"/>
    <text x="82" y="44" font-family="Manrope, Inter, sans-serif" font-size="16" font-weight="700" fill="#fff">API Spring Boot</text>
    <text x="82" y="64" font-family="Manrope, Inter, sans-serif" font-size="11" fill="#9aa3b8">Java 25 · Boot 4.1.1</text>
    <g font-family="Manrope, Inter, sans-serif" font-size="12" fill="#e8ebf2">
      <rect x="22" y="96" width="276" height="38" rx="12" fill="#ff3d71" fill-opacity=".1" stroke="#ff8aa5" stroke-opacity=".25"/>
      <text x="36" y="120">Controllers REST · DTO records</text>
      <rect x="22" y="144" width="276" height="38" rx="12" fill="#7dd3fc" fill-opacity=".08" stroke="#7dd3fc" stroke-opacity=".22"/>
      <text x="36" y="168">Services métier · transactions</text>
      <rect x="22" y="192" width="276" height="38" rx="12" fill="#ffc46b" fill-opacity=".08" stroke="#ffc46b" stroke-opacity=".22"/>
      <text x="36" y="216">Repositories JPA · verrou pessimiste</text>
    </g>
    <text x="22" y="258" font-family="Manrope, Inter, sans-serif" font-size="11" fill="#c9cfdd">HTTP Basic · BCrypt · rôles CLIENT / PROGRAMMATEUR / ADMIN</text>
    <text x="22" y="280" font-family="Manrope, Inter, sans-serif" font-size="11" fill="#c9cfdd">ApiError centralisé · validation Jakarta</text>
  </g>

  <!-- MySQL -->
  <g transform="translate(790 128)">
    <rect width="262" height="170" rx="24" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".18"/>
    <rect x="22" y="22" width="46" height="46" rx="14" fill="#ffc46b" fill-opacity=".14" stroke="#ffc46b" stroke-opacity=".4"/>
    <ellipse cx="45" cy="36" rx="14" ry="6" fill="none" stroke="#ffc46b" stroke-width="2"/>
    <path d="M31 36v18c0 3.5 6.3 6 14 6s14-2.5 14-6V36" fill="none" stroke="#ffc46b" stroke-width="2"/>
    <text x="82" y="44" font-family="Manrope, Inter, sans-serif" font-size="16" font-weight="700" fill="#fff">MySQL 8.4</text>
    <text x="82" y="64" font-family="Manrope, Inter, sans-serif" font-size="11" fill="#9aa3b8">InnoDB · Flyway V1 → V5</text>
    <text x="22" y="110" font-family="Manrope, Inter, sans-serif" font-size="12" fill="#c9cfdd">film · salle · seance · reservation</text>
    <text x="22" y="134" font-family="Manrope, Inter, sans-serif" font-size="12" fill="#c9cfdd">ddl-auto=validate</text>
    <text x="22" y="154" font-family="Manrope, Inter, sans-serif" font-size="11" fill="#ff8aa5">⚠ capacité sous concurrence</text>
  </g>

  <!-- TMDB -->
  <g transform="translate(790 330)">
    <rect width="262" height="160" rx="24" fill="#ffffff" fill-opacity=".04" stroke="#7dd3fc" stroke-opacity=".25"/>
    <rect x="22" y="22" width="46" height="46" rx="14" fill="#7dd3fc" fill-opacity=".12" stroke="#7dd3fc" stroke-opacity=".35"/>
    <path d="M45 34c-7 0-13 6-13 13 0 8 13 18 13 18s13-10 13-18c0-7-6-13-13-13zm0 8a5 5 0 110 10 5 5 0 010-10z" fill="none" stroke="#7dd3fc" stroke-width="2"/>
    <text x="82" y="44" font-family="Manrope, Inter, sans-serif" font-size="16" font-weight="700" fill="#fff">TMDB</text>
    <text x="82" y="64" font-family="Manrope, Inter, sans-serif" font-size="11" fill="#9aa3b8">API externe (serveur only)</text>
    <text x="22" y="106" font-family="Manrope, Inter, sans-serif" font-size="12" fill="#c9cfdd">affiches · bannières · trailers</text>
    <text x="22" y="130" font-family="Manrope, Inter, sans-serif" font-size="12" fill="#c9cfdd">cache 12 h · échec 10 min</text>
  </g>

  <!-- Flèches -->
  <g stroke="#7dd3fc" stroke-width="2" fill="none" marker-end="url(#fleche)" stroke-opacity=".8">
    <path d="M300 236H364"/>
    <path d="M566 236H700v-40h72"/>
    <path d="M700 236v154h72"/>
  </g>
  <g font-family="Manrope, Inter, sans-serif" font-size="10" fill="#9aa3b8">
    <text x="304" y="226">HTTP Basic · JSON</text>
    <text x="620" y="190">JPA · SELECT … FOR UPDATE</text>
    <text x="606" y="416">RestClient</text>
  </g>

  <text x="48" y="520" font-family="Manrope, Inter, sans-serif" font-size="11" fill="#9aa3b8">Tests : 29 (unitaires, MVC, JPA, intégration et concurrence) · CI GitHub Actions · image GHCR</text>
  <rect x="48" y="534" width="1004" height="1" fill="#ffffff" fill-opacity=".1"/>
</svg>
