<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05060a" />
    <meta
      name="description"
      content="Billetterie du cinéma : films à l'affiche, bandes-annonces, séances et réservation en ligne."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="modulepreload" href="/liquidglass/components.js" />
    <title>Billetterie — Cinéma</title>
    <style>
      html,
      body {
        margin: 0;
        background: #05060a;
        color: #fff;
      }
      .boot {
        display: grid;
        min-height: 100vh;
        place-content: center;
        justify-items: center;
        gap: 14px;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .boot__mark {
        width: 46px;
        height: 46px;
        border-radius: 15px;
        background: linear-gradient(150deg, #ff3d71, #7dd3fc);
        box-shadow: 0 0 48px rgba(255, 61, 113, 0.35);
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      .boot p {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #9aa3b8;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot__mark"></div>
        <p>Chargement…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
