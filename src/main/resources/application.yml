spring:
  application:
    name: billetterie-cinema
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/billetterie?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:billetterie}
    password: ${DB_PASSWORD:billetterie}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 30
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,image/svg+xml
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  tmdb:
    api-key: ${TMDB_API_KEY:}
    base-url: ${TMDB_BASE_URL:https://api.themoviedb.org/3}
    image-base-url: ${TMDB_IMAGE_BASE_URL:https://image.tmdb.org/t/p}

logging:
  level:
    fr.butinfo.r508.billetterie: INFO
