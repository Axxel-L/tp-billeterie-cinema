services:
  mysql:
    image: mysql:8.4
    container_name: billetterie-mysql
    environment:
      MYSQL_DATABASE: billetterie
      MYSQL_USER: billetterie
      MYSQL_PASSWORD: billetterie
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
